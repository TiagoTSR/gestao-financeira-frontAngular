<div class="login-wrapper flex align-items-center justify-content-center min-h-screen px-3 py-6">
  <div class="login-card surface-card p-5 shadow-2 border-round w-full sm:w-30rem">
    
    <!-- Cabeçalho -->
    <div class="text-center mb-5">
      <div class="inline-flex align-items-center justify-content-center bg-blue-100 border-circle w-4rem h-4rem mb-3">
        <i class="pi pi-wallet text-blue-600 text-3xl"></i>
      </div>
      <h1 class="text-900 font-bold text-2xl mb-2">Gestão Financeira</h1>
      <p class="text-600 font-medium text-sm">Entre com suas credenciais para acessar</p>
    </div>

    <!-- Alerta de Erro -->
    @if (erro()) {
      <div class="p-3 mb-4 bg-red-100 border-round text-red-700 text-sm flex align-items-center gap-2" role="alert">
        <i class="pi pi-exclamation-circle text-lg"></i>
        <span>{{ erro() }}</span>
      </div>
    }

    <!-- Formulário -->
    <form #loginForm="ngForm" (ngSubmit)="entrar(loginForm)" class="flex flex-column gap-4" novalidate>
      
      <div class="flex flex-column gap-2">
        <label for="email" class="font-semibold text-slate-700 text-sm">E-mail *</label>
        <span class="p-input-icon-left w-full">
          <i class="pi pi-envelope text-slate-400"></i>
          <input
            pInputText
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            #emailInput="ngModel"
            required
            placeholder="Ex: admin@example.com"
            class="w-full"
            [class.ng-invalid]="submetido() && emailInput.invalid"
            [class.ng-dirty]="submetido() && emailInput.invalid"
            [disabled]="carregando()"
            autocomplete="email"
          />
        </span>
        @if (submetido() && emailInput.invalid) {
          <small class="text-red-500 font-medium text-xs">Informe o e-mail.</small>
        }
      </div>

      <div class="flex flex-column gap-2">
        <label for="senha" class="font-semibold text-slate-700 text-sm">Senha *</label>
        <span class="p-input-icon-left w-full">
          <i class="pi pi-lock text-slate-400"></i>
          <input
            pInputText
            type="password"
            id="senha"
            name="senha"
            [(ngModel)]="senha"
            #senhaInput="ngModel"
            required
            placeholder="Ex: admin"
            class="w-full"
            [class.ng-invalid]="submetido() && senhaInput.invalid"
            [class.ng-dirty]="submetido() && senhaInput.invalid"
            [disabled]="carregando()"
            autocomplete="current-password"
          />
        </span>
        @if (submetido() && senhaInput.invalid) {
          <small class="text-red-500 font-medium text-xs">Informe a senha.</small>
        }
      </div>

      <p-button
        type="submit"
        [label]="carregando() ? 'Entrando...' : 'Entrar'"
        [icon]="carregando() ? 'pi pi-spin pi-spinner' : 'pi pi-sign-in'"
        styleClass="w-full mt-2"
        [loading]="carregando()"
        [disabled]="carregando()"
      ></p-button>

    </form>

    <div class="mt-4 text-center">
      <span class="text-xs text-slate-400">
        Credenciais padrão: <strong>admin@example.com</strong> / <strong>admin</strong>
      </span>
    </div>

  </div>
</div>
